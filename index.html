<!DOCTYPE html>
<html>
<head>
  <title>Stardew Valley Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
   html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      height: 700px;
      width: 100%;
      border: 2px solid #333;
    }
  </style>
</head>

<body>
  <h2>Stardew Valley Interactive Map</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Custom marker icons
const iconGreen = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

const iconBlue = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

// Fishing (yellow)
const iconYellow = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

// Foraging (orange)
const iconOrange = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

// Mines (black)
const iconBlack = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-black.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});


    // Map image size (update if your image is different!)
    const mapWidth = 1920;
    const mapHeight = 1080;

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -2,
      maxZoom: 2
    });

    const bounds = [[0, 0], [mapHeight, mapWidth]];

    // IMPORTANT: use a relative file path, not a Windows path!
    L.imageOverlay('Stardew-Valley_Map.jpg', bounds).addTo(map);

    map.fitBounds(bounds);
    
   // Helper: click anywhere on the map to see its coordinates
map.on('click', function (e) {
  const y = e.latlng.lat.toFixed(1); // vertical
  const x = e.latlng.lng.toFixed(1); // horizontal

  L.popup()
    .setLatLng(e.latlng)
    .setContent(`y: ${y}, x: ${x}`)
    .openOn(map);

  console.log(`Clicked at: [${y}, ${x}]`);
});
    
// 1. Farmhouse (Green)
L.marker([644.1, 685.0], { icon: iconGreen }).addTo(map)
  .bindPopup("Farmhouse");

// 2. Pierre's General Store (Blue)
L.marker([556.1, 1140.9], { icon: iconBlue }).addTo(map)
  .bindPopup("<b>Pierre's General Store</b><br>Open: 9am – 5pm<br>Closed: Wednesdays (Year 1)");

// 3. Carpenter's Shop (Blue)
L.marker([843.1, 1119.1], { icon: iconBlue }).addTo(map)
  .bindPopup("<b>Carpenter's Shop</b><br>Open: 9am – 5pm<br>Closed: Tuesdays");

// 4. Blacksmith (Blue)
L.marker([443.2, 1378.0], { icon: iconBlue }).addTo(map)
  .bindPopup("<b>Blacksmith (Clint)</b><br>Open: 9am – 4pm<br>Closed: Fridays if visiting Community Center cutscene");

// 5. Community Center (Blue)
L.marker([715.1, 1190.0], { icon: iconBlue }).addTo(map)
  .bindPopup("<b>Community Center</b><br>Open: 8am – 8pm<br>Unlocked: Spring 5");

// 6. Mountain Lake Fishing Spot (Light Blue)
L.marker([837.1, 1367.0], { icon: iconYellow }).addTo(map)
  .bindPopup("Mountain Lake – Fishing");

// 7. Cindersap Forest Foraging Area (Brown)
L.marker([387.2, 537.0], { icon: iconOrange }).addTo(map)
  .bindPopup("Cindersap Forest – Foraging Route");

// 8. Mines Entrance (Black)
L.marker([906.6, 1303.5], { icon: iconBlack }).addTo(map)
  .bindPopup("Mines Entrance");

// 9. Beach Pier (Fishing) (Light Blue)
L.marker([167.6, 1229.0], { icon: iconYellow }).addTo(map)
  .bindPopup("Beach Pier – Fishing");

// 10. JojaMart (Blue)
L.marker([572.0, 1391.0], {icon: iconBlue }).addTo(map)
   .bindPopup("<b>JojaMart</b><br>Open: 9am - 11pm<br>Closed: After Community Center Completion");

  </script>
</body>
</html>
